{% extends 'GeneralBlogApp/base.html' %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Sign Up</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Sign Up</button>
        </form>
        
        <p class="auth-footer-text">
            Already have an account? <a href="{% url 'login' %}">Log in</a>
        </p>
    </div>
</div>
{% endblock %}
