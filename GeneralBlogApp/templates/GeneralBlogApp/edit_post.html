{% extends 'GeneralBlogApp/base.html' %}

{% block title %}
Edit Post
{% endblock %}


{% block content %}

<section class="editor-section">

    <div class="editor-card">

        <h1>Edit Post</h1>

        <p class="editor-subtitle">
            Update your article details.
        </p>


        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}


            <div class="form-group">

                <label for="title">
                    Title
                </label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ post.title }}"
                    placeholder="Title">

            </div>



            <div class="form-group">

                <label for="category">
                    Category
                </label>


                <select
                    id="category"
                    name="category">


                    <option value="lifestyle"
                    {% if post.category == "lifestyle" %}
                    selected
                    {% endif %}>
                        Lifestyle
                    </option>


                    <option value="business"
                    {% if post.category == "business" %}
                    selected
                    {% endif %}>
                        Business
                    </option>



                    <option value="tech"
                    {% if post.category == "tech" %}
                    selected
                    {% endif %}>
                        Tech
                    </option>



                    <option value="health"
                    {% if post.category == "health" %}
                    selected
                    {% endif %}>
                        Health
                    </option>



                    <option value="other"
                    {% if post.category == "other" %}
                    selected
                    {% endif %}>
                        Other
                    </option>


                </select>


            </div>




            <div class="form-group">

                <label>
                    Current Image
                </label>


                {% if post.image %}

                <div class="current-image">

                    <img src="{{ post.image.url }}"
                         alt="{{ post.title }}">

                </div>

                {% endif %}


                <label for="image">
                    Change Image
                </label>


                <input
                    type="file"
                    id="image"
                    name="image">


            </div>




            <div class="form-group">


                <label for="content">
                    Content
                </label>


                <textarea
                    id="content"
                    name="content"
                    rows="12">{{ post.content }}</textarea>


            </div>




            <button
                type="submit"
                class="btn btn-primary">

                Update Post

            </button>


        </form>


    </div>

</section>


{% endblock %}
